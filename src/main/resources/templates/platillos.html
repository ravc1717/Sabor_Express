<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sabor Express</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .titulo{
            text-align:center;
            margin:40px 0;
            font-size:45px;
            font-weight:bold;
            color:#ff6600;
        }

        .card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            transition:0.3s;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
            background:white;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .card img{
            height:220px;
            object-fit:cover;
            width:100%;
        }

        .categoria{
            background:#ff6600;
            color:white;
            padding:6px 15px;
            border-radius:20px;
            font-size:14px;
            font-weight:bold;
            text-transform:uppercase;
        }

        .precio{
            color:#28a745;
            font-size:26px;
            font-weight:bold;
            margin-top:15px;
        }

        .btn-pedir{
            background:#ff6600;
            color:white;
            border:none;
            border-radius:10px;
            padding:10px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn-pedir:hover{
            background:#e65c00;
            color:white;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- TITULO -->
    <h1 class="titulo">
        🍽 Sabor Express
    </h1>

    <!-- FILA -->
    <div class="row g-4">

        <!-- CARD -->
        <div class="col-md-4"
             th:each="platillo : ${platillos}">

            <div class="card h-100">

                <!-- IMAGEN -->
                <img th:src="@{'/img/' + ${platillo.imagen}}"
                     class="card-img-top"
                     alt="Imagen del platillo">

                <!-- CONTENIDO -->
                <div class="card-body d-flex flex-column">

                    <!-- CATEGORIA -->
                    <span class="categoria"
                          th:text="${platillo.categoria}">
                    </span>

                    <!-- NOMBRE -->
                    <h3 class="mt-3 fw-bold"
                        th:text="${platillo.nombre == 'Sándwich Matutino' ? 'Pupusas' : platillo.nombre}">
                    </h3>

                    <!-- DESCRIPCION -->
                    <p class="text-muted"
                       th:text="${platillo.descripcion}">
                    </p>

                    <!-- PRECIO -->
                    <div class="precio">
                        $<span th:text="${platillo.precio}"></span>
                    </div>

                    <!-- BOTON -->
                    <a th:href="@{'/pedido/' + ${platillo.nombre}}"
                       class="btn btn-pedir w-100 mt-3">
                        🛒 Pedir Ahora
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
