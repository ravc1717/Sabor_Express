<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Reportes</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- ICONOS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#f4f6f9;
            font-family:Arial, sans-serif;
        }

        .navbar{
            background:#ff6600;
        }

        .navbar-brand{
            color:white !important;
            font-size:28px;
            font-weight:bold;
        }

        .titulo{
            font-size:40px;
            font-weight:bold;
            margin-top:30px;
            margin-bottom:30px;
            color:#333;
        }

        .card-dashboard{
            border:none;
            border-radius:20px;
            padding:25px;
            color:white;
            transition:0.3s;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        .card-dashboard:hover{
            transform:translateY(-5px);
        }

        .bg1{
            background:linear-gradient(135deg,#ff6600,#ff9966);
        }

        .bg2{
            background:linear-gradient(135deg,#28a745,#5dd879);
        }

        .bg3{
            background:linear-gradient(135deg,#007bff,#5ba8ff);
        }

        .bg4{
            background:linear-gradient(135deg,#6f42c1,#9b6dff);
        }

        .numero{
            font-size:40px;
            font-weight:bold;
        }

        .icono{
            font-size:50px;
            opacity:0.3;
        }

        .tabla{
            background:white;
            border-radius:20px;
            padding:20px;
            margin-top:40px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="#">
            🍽 Sabor Express Dashboard
        </a>

    </div>

</nav>

<div class="container">

    <!-- TITULO -->
    <h1 class="titulo">
        📊 Dashboard de Reportes
    </h1>

    <!-- CARDS -->
    <div class="row g-4">

        <!-- CARD 1 -->
        <div class="col-md-3">

            <div class="card-dashboard bg1">

                <div class="d-flex justify-content-between">

                    <div>

                        <h5>Total Pedidos</h5>

                        <div class="numero">
                            120
                        </div>

                    </div>

                    <div class="icono">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>

                </div>

            </div>

        </div>

        <!-- CARD 2 -->
        <div class="col-md-3">

            <div class="card-dashboard bg2">

                <div class="d-flex justify-content-between">

                    <div>

                        <h5>Ventas Hoy</h5>

                        <div class="numero">
                            $850
                        </div>

                    </div>

                    <div class="icono">
                        <i class="fa-solid fa-dollar-sign"></i>
                    </div>

                </div>

            </div>

        </div>

        <!-- CARD 3 -->
        <div class="col-md-3">

            <div class="card-dashboard bg3">

                <div class="d-flex justify-content-between">

                    <div>

                        <h5>Clientes</h5>

                        <div class="numero">
                            65
                        </div>

                    </div>

                    <div class="icono">
                        <i class="fa-solid fa-users"></i>
                    </div>

                </div>

            </div>

        </div>

        <!-- CARD 4 -->
        <div class="col-md-3">

            <div class="card-dashboard bg4">

                <div class="d-flex justify-content-between">

                    <div>

                        <h5>Platillos</h5>

                        <div class="numero">
                            9
                        </div>

                    </div>

                    <div class="icono">
                        <i class="fa-solid fa-utensils"></i>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLA -->
    <div class="tabla">

        <h3 class="mb-4">
            📋 Últimos Pedidos
        </h3>

        <table class="table table-hover">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Platillo</th>
                <th>Cantidad</th>
                <th>Teléfono</th>
            </tr>

            </thead>

            <tbody>

            <tr>
                <td>1</td>
                <td>Rodrigo</td>
                <td>Carne Asada</td>
                <td>2</td>
                <td>7777-7777</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Ana</td>
                <td>Pupusas</td>
                <td>3</td>
                <td>8888-8888</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Carlos</td>
                <td>Sopa de Pollo</td>
                <td>1</td>
                <td>9999-9999</td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
