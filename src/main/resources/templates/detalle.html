<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#ff6600,#ff9966);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        .card{
            width:500px;
            border:none;
            border-radius:25px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .titulo{
            text-align:center;
            color:#ff6600;
            font-weight:bold;
            margin-bottom:25px;
        }

        .btn-guardar{
            background:#ff6600;
            color:white;
            font-weight:bold;
            border:none;
        }

        .btn-guardar:hover{
            background:#e65c00;
        }

    </style>

</head>

<body>

<div class="card">

    <h2 class="titulo">
        🍽 Realizar Pedido
    </h2>

    <form th:action="@{/guardar-pedido}"
          th:object="${pedido}"
          method="post">

        <div class="mb-3">
            <label class="form-label">Platillo</label>

            <input type="text"
                   th:field="*{platillo}"
                   class="form-control"
                   readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre Cliente</label>

            <input type="text"
                   th:field="*{cliente}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>

            <input type="text"
                   th:field="*{telefono}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección</label>

            <textarea th:field="*{direccion}"
                      class="form-control"
                      required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>

            <input type="number"
                   th:field="*{cantidad}"
                   class="form-control"
                   min="1"
                   required>
        </div>

        <button type="submit"
                class="btn btn-guardar w-100">
            Guardar Pedido
        </button>

    </form>

</div>

</body>

</html>
