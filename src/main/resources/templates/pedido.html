<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#ff6600,#ff9966);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }

        .card{
            width:500px;
            border:none;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .titulo{
            text-align:center;
            color:#ff6600;
            font-weight:bold;
            margin-bottom:25px;
        }

        .btn-orange{
            background:#ff6600;
            color:white;
            width:100%;
            border:none;
            padding:12px;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="card">

    <h2 class="titulo">
        Confirmar Pedido
    </h2>

    <form th:action="@{/guardar-pedido}"
          th:object="${pedido}"
          method="post">

        <div class="mb-3">
            <label>Platillo</label>

            <input type="text"
                   th:field="*{platillo}"
                   class="form-control"
                   readonly>
        </div>

        <div class="mb-3">
            <label>Precio</label>

            <input type="number"
                   step="0.01"
                   th:field="*{precio}"
                   class="form-control"
                   readonly>
        </div>

        <div class="mb-3">
            <label>Cliente</label>

            <input type="text"
                   th:field="*{cliente}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Teléfono</label>

            <input type="text"
                   th:field="*{telefono}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Dirección</label>

            <input type="text"
                   th:field="*{direccion}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-4">
            <label>Cantidad</label>

            <input type="number"
                   th:field="*{cantidad}"
                   class="form-control"
                   min="1"
                   required>
        </div>

        <button type="submit"
                class="btn-orange">

            Confirmar Pedido

        </button>

    </form>

</div>

</body>
</html>
