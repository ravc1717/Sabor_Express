<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sabor Express</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card-box {
            text-align: center;
            padding: 50px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
            backdrop-filter: blur(10px);
            width: 450px;
        }

        h1 {
            font-size: 40px;
            font-weight: bold;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .btn-tech {
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }

        .btn-tech:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #38bdf8;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="card-box">

    <div class="icon">🍽️</div>

    <h1>Sabor Express</h1>

    <p>
        Sistema inteligente de pedidos de restaurante<br>
        Tecnología + sabor en un solo lugar
    </p>

    <a href="/platillos" class="btn btn-tech">
        Ver Platillos
    </a>

</div>

</body>
</html>
